name: Check NagramXF release

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-release:
    name: Check upstream compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read latest NagramXF release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api repos/Keeperorowner/NagramXF/releases/latest)"
          name="$(jq -r '.name // empty' <<< "$release")"
          tag="$(jq -r '.tag_name // empty' <<< "$release")"
          if [[ -z "$name" || -z "$tag" ]]; then
            echo "Latest NagramXF release is missing its name or tag." >&2
            exit 1
          fi
          sha="$(gh api "repos/Keeperorowner/NagramXF/commits/$tag" --jq '.sha')"
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Update compatibility targets
        id: target
        env:
          RELEASE_NAME: ${{ steps.upstream.outputs.name }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_nagramxf_target.py \
            "$RELEASE_NAME" \
            "$RELEASE_TAG" \
            "$RELEASE_SHA"
          if git diff --quiet -- patches/src/main/kotlin/app/shinicell/morphepatches/patches/shared/Constants.kt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build patch bundle
        if: steps.target.outputs.changed == 'true'
        run: ./gradlew :patches:build --no-daemon

      - name: Open compatibility update PR
        if: steps.target.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/nagramxf-${{ steps.upstream.outputs.tag }}
          delete-branch: true
          commit-message: "bump: support NagramXF ${{ steps.upstream.outputs.name }}"
          title: "bump: support NagramXF ${{ steps.upstream.outputs.name }}"
          body: |
            NagramXF published a new release: ${{ steps.upstream.outputs.name }}.

            This PR adds its version and ARM64 version code to the compatibility targets. The patch bundle build ran before this PR was opened. Review the upstream release and test patching before merging.
          token: ${{ secrets.GITHUB_TOKEN }}
